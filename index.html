<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Digital Archive</title>
    <style>
        /* Modern Dark Arcade Style */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Navigation Menu Bar */
        .arcade-nav {
            background-color: #1a1a24;
            width: 100%;
            padding: 15px 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }

        /* Arcade Game Buttons */
        .game-btn {
            background: linear-gradient(135deg, #3a3d52 0%, #232433 100%);
            color: #ffffff;
            border: 2px solid #4f5473;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-btn:hover {
            background: #5d638c;
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            transform: translateY(-2px);
        }

        .game-btn.active {
            background: linear-gradient(135deg, #00ffcc 0%, #0099ff 100%);
            color: #0f0f12;
            border-color: #ffffff;
        }

        /* Game Screen Container */
        .window-container {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Game Display Screen */
        iframe {
            width: 100%;
            height: 100%;
            max-height: 700px;
            border: 4px solid #1a1a24;
            border-radius: 12px;
            background-color: #141419;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>

    <!-- Top Game Switching Menu -->
    <nav class="arcade-nav">
        <button class="game-btn active" onclick="switchGame('https://bitlife-freeonline.github.io/', this)">BitLife</button>
        <button class="game-btn" onclick="switchGame('https://gamedistribution.com', this)">Smash Karts</button>
        <button class="game-btn" onclick="switchGame('https://shellshock.io', this)">Shell Shockers</button>
        <button class="game-btn" onclick="switchGame('https://gamedistribution.com', this)">Moto X3M</button>
    </nav>

    <!-- Game Box Screen -->
    <div class="window-container">
        <iframe id="arcade-screen" src="https://bitlife-freeonline.github.io/" allowfullscreen></iframe>
    </div>

    <!-- Script to handle dynamic game changing -->
    <script>
        function switchGame(gameUrl, buttonElement) {
            // Update the screen source link
            document.getElementById('arcade-screen').src = gameUrl;
            
            // Clear out old active button styles
            const buttons = document.querySelectorAll('.game-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Highlight the clicked button
            buttonElement.classList.add('active');
        }
    </script>

</body>
</html>
