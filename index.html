<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Analytics Engine</title>
    <style>
        :root {
            --bg-base: #08080b;
            --bg-surface: #11111a;
            --bg-accent: #1b1b2a;
            --accent: #00ffaa;
            --text-main: #ffffff;
            --text-muted: #8a8a9e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation Matrix Layout */
        .sidebar {
            width: 280px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--bg-accent);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand-header {
            padding: 20px;
            border-bottom: 1px solid var(--bg-accent);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .search-wrapper {
            padding: 15px;
        }

        .search-bar {
            width: 100%;
            padding: 10px 15px;
            background-color: var(--bg-base);
            border: 1px solid var(--bg-accent);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px 15px;
        }

        .cat-item {
            background: none;
            border: none;
            color: var(--text-muted);
            text-align: left;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-item:hover, .cat-item.active {
            background-color: var(--bg-accent);
            color: var(--accent);
        }

        /* Main Workspace Viewport Windows */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
            position: relative;
        }

        /* Grid Display System */
        .grid-viewport {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            align-content: start;
        }

        .arcade-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--bg-accent);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .arcade-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .card-graphic {
            height: 100px;
            background: linear-gradient(135deg, #232336 0%, #0f0f17 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .card-meta {
            padding: 12px;
        }

        .card-name {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-badge {
            font-size: 10px;
            color: var(--accent);
            background-color: rgba(0, 255, 170, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Decoupled Live Gameplay Stage */
        .player-viewport {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--bg-base);
            z-index: 10;
        }

        .stage-banner {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--bg-accent);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exit-btn {
            background-color: var(--bg-accent);
            color: #fff;
            border: 1px solid #3d3d5c;
            padding: 8px 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }

        .exit-btn:hover {
            background-color: #ff3366;
            border-color: #ff3366;
        }

        .iframe-stage-wrapper {
            flex: 1;
            padding: 15px;
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 2px solid var(--bg-accent);
            border-radius: 8px;
            background-color: #000;
        }
    </style>
</head>
